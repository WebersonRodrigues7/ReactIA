<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReactIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body data-theme="light" data-chat-started="false">
    <main class="app-shell">
      <section class="workspace" aria-label="ReactIA">
        <div class="drawer-backdrop" data-drawer-backdrop></div>

        <aside class="panel" data-side-panel>
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">
              <span class="iconify" data-icon="logos:react" data-width="28" data-height="28"></span>
            </span>
            <div>
              <strong>ReactIA</strong>
              <span>Historico e roadmap</span>
            </div>
            <button class="icon-button panel-close" type="button" data-close-panel aria-label="Fechar painel">
              <i data-lucide="x"></i>
            </button>
          </div>

          <button class="new-chat-button" type="button" data-new-chat>
            <i data-lucide="plus"></i>
            <span>Nova conversa</span>
          </button>

          <div class="conversation-panel" aria-label="Historico de conversas">
            <div class="panel-label">
              <span>Historico</span>
              <strong data-memory-count>0</strong>
            </div>
            <div class="conversation-list" data-conversation-list></div>
          </div>

          <a class="roadmap-link" href="/roadmap">
            <i data-lucide="map"></i>
            <span>Roadmap de estudos</span>
          </a>
        </aside>

        <section class="chat">
          <header class="chat__header">
            <button class="icon-button" type="button" data-open-panel aria-label="Mostrar historico e roadmap">
              <i data-lucide="panel-left-open"></i>
            </button>

            <div class="top-brand" aria-label="ReactIA">
              <span class="top-brand__mark" aria-hidden="true">
                <span class="iconify" data-icon="logos:react" data-width="34" data-height="34"></span>
              </span>
              <div>
                <p>Assistente de estudos</p>
                <h1 data-chat-title>Nova conversa</h1>
              </div>
            </div>

            <button class="icon-button" type="button" data-theme-toggle aria-label="Alternar modo claro e escuro">
              <i data-lucide="moon"></i>
            </button>
          </header>

          <div class="chat__messages" data-chat-messages aria-live="polite"></div>

          <form class="composer" data-chat-form>
            <label class="sr-only" for="message">Pergunte sobre React</label>
            <textarea
              id="message"
              data-chat-input
              rows="3"
              placeholder="Pergunte sobre hooks, componentes, estado, props, bibliotecas React..."
              autocomplete="off"
            ></textarea>
            <button type="submit" data-submit-button>
              <span>Enviar</span>
              <i data-lucide="send"></i>
            </button>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
